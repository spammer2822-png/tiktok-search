for(const [key,label] of [['all','All'],['matches','Target Matches'],['mutuals','Mutuals'],['complete','Complete'],['partial','Partial'],['private','Private'],['errors','Errors'],['skipped','Skipped']]){const b=el('button',label);b.dataset.quick=key;$('quick').append(b)}
function matchesView(r,key){switch(key){case 'matches':return r.target_found;case 'mutuals':return r.mutual===true;case 'skipped':return r.skipped;case 'errors':return r.hard_error||r.status==='partial';case 'complete':return r.complete;case 'partial':return r.status==='partial';case 'private':return r.status==='private';default:return true}}

function sortRows(){requestPage()}

function makeAvatar(r){const fallback=Array.from(r.username).find(c=>/[\p{L}\p{N}]/u.test(c))?.toUpperCase()||'•',av=el('span',fallback,'avatar');av.setAttribute('aria-hidden','true');const src=String(r.avatar||'');if(/^(?:report_assets\/avatars\/[a-f0-9]{64}\.jpg|data:image\/jpeg;base64,[A-Za-z0-9+/=]+)$/.test(src)){const img=el('img');img.alt='';img.width=40;img.height=40;img.loading='lazy';img.decoding='async';img.addEventListener('error',()=>{av.textContent=fallback},{once:true});img.src=src;av.replaceChildren(img)}return av}
function render(){const cols=columns(),head=el('tr');for(const [key,label] of cols){const th=el('th');if(['username','followers','following','phase','status','target_found','relationship_label'].includes(key)){const b=el('button',label+(key===sort?(ascending?' ↑':' ↓'):' ↕'));b.dataset.sort=key;th.setAttribute('aria-sort',key===sort?(ascending?'ascending':'descending'):'none');th.append(b)}else th.textContent=label;head.append(th)}$('table-head').replaceChildren(head);const fragment=document.createDocumentFragment();for(const r of filtered){const tr=el('tr');for(const [key] of cols){const td=el('td');if(key==='username'){const wrap=el('div',undefined,'account'),av=makeAvatar(r);const text=el('div');text.append(el('div','@'+r.username,'username'),el('div',r.display_name||'—','display'));wrap.append(av,text);td.append(wrap)}else if(key==='uid'){td.textContent=r.uid||'Unknown';td.className='mono'}else if(key==='phase')td.append(badge(r.phase==='bootstrap'?'Bootstrap':'Phase '+r.phase,'purple phase'));else if(key==='relationship_label')td.append(badge(r.relationship_label,relationshipColor(r)));else if(key==='status')td.append(badge(r.status,statusColor(r)));else if(key==='action'){const b=el('button','View','view');b.dataset.row=r._id;b.setAttribute('aria-label','View @'+r.username);td.append(b)}else if(key==='target_found')td.append(badge(r.target_found?'Found':'Not observed',r.target_found?'green':''));else if(key==='limits')td.textContent=`Followers: ${DATA.configuration.follower_skip_limit||'Unlimited'} · Following: ${DATA.configuration.following_skip_limit||'Unlimited'}`;else if(key==='completion')td.textContent=['followers','following'].map(k=>k+': '+(r.list_results[k].complete?'Complete':r.list_results[k].stop_reason||'Unknown')).join(' / ');else if(key==='completed_at_utc')td.textContent=Object.values(r.match_observed_at_utc).join(' / ')||r.completed_at_utc||'Unknown';else td.textContent=fmt(r[key]);tr.append(td)}fragment.append(tr)}if(!filtered.length){const tr=el('tr'),td=el('td','No accounts match these filters.','empty');td.colSpan=cols.length;tr.append(td);fragment.append(tr)}$('table-body').replaceChildren(fragment);const pages=Math.max(1,Math.ceil(total/pageSize));$('result-count').textContent=fmt(total)+' result(s)';$('page-label').textContent=`Page ${page} of ${pages}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;for(const b of $('quick').children)b.classList.toggle('active',b.dataset.quick===quick)}
function navigate(value){section=value;quick='all';for(const b of $('navigation').children){b.classList.toggle('active',b.dataset.section===value);b.setAttribute('aria-current',b.dataset.section===value?'page':'false')}$('directory').classList.toggle('hidden',value==='phases');$('overview').classList.toggle('hidden',value!=='overview');$('phases').classList.toggle('hidden',value!=='phases');$('directory-title').textContent=value==='overview'?'Account directory':sections.find(s=>s[0]===value)[2];$('directory-subtitle').textContent=value==='matches'?'Accounts with a confirmed target observation':value==='mutuals'?'Target confirmed in both followers and following':value==='skipped'?'Accounts skipped, with saved reasons and configured limits':value==='errors'?'Request failures and incomplete collection outcomes':'Search and inspect every account processed during this scan';filterRows()}
$('navigation').addEventListener('click',e=>{const b=e.target.closest('[data-section]');if(b)navigate(b.dataset.section)});
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(filterRows,170)});
$('filters').addEventListener('change',filterRows);$('filters').addEventListener('input',e=>{if(e.target.tagName==='INPUT'){clearTimeout(searchTimer);searchTimer=setTimeout(filterRows,170)}});$('clear').addEventListener('click',()=>{for(const s of $('filters').querySelectorAll('[data-filter]'))s.value='';$('search').value='';quick='all';filterRows()});
$('quick').addEventListener('click',e=>{const b=e.target.closest('[data-quick]');if(b){quick=b.dataset.quick;filterRows()}});
$('page-size').addEventListener('change',()=>{pageSize=Number($('page-size').value);page=1;requestPage()});$('prev').addEventListener('click',()=>{page--;requestPage()});$('next').addEventListener('click',()=>{page++;requestPage()});
$('table-head').addEventListener('click',e=>{const b=e.target.closest('[data-sort]');if(b){ascending=b.dataset.sort===sort?!ascending:true;sort=b.dataset.sort;sortRows()}});
$('table-body').addEventListener('click',e=>{const b=e.target.closest('[data-row]');if(!b)return;const r=filtered.find(row=>row._id===Number(b.dataset.row));if(!r)return;$('modal-avatar').replaceChildren(makeAvatar(r));$('modal-title').textContent='@'+r.username;$('modal-subtitle').textContent=r.display_name||'Saved account details';addFields($('modal-fields'),[['Username',r.username],['Display name',r.display_name],['TikTok user ID',r.uid],['Follower count',r.followers],['Following count',r.following],['Advertised counts',r.advertised_counts],['Phase',r.phase],['Status',r.status],['Target found',r.target_found?'Yes':'Not observed'],['Found in',r.found_in.join(', ')||'Not observed'],['Target follows this account',truth(r.relationship.target_follows_profile)],['This account follows target',truth(r.relationship.profile_follows_target)],['Mutual',truth(r.mutual)],['Discovered from',r.sources.join(', ')],['Skip reason',r.skip_reason||'—'],['Error',r.error||'—'],['HTTP code',r.http_code],['Retries',r.retry_count],['Followers result',r.list_results.followers],['Following result',r.list_results.following],['Warnings',r.warnings.join('\n')||'None'],['Started',r.started_at_utc],['Saved',r.completed_at_utc],['Target observation times',r.match_observed_at_utc]]);const link=$('profile-link');link.classList.toggle('hidden',! /^[A-Za-z0-9._]{1,30}$/.test(r.username));link.href='https://www.tiktok.com/@'+encodeURIComponent(r.username);$('modal').showModal()});
$('close-modal').addEventListener('click',()=>$('modal').close());$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('modal').close()}});
$('footer').textContent='Local scan archive · Generated '+DATA.generated_at_utc+' · No network requests are made by this report.';navigate('overview');
return acceptPage;
}
(function boot(){
  const metaNode=document.getElementById('report-data'),rowsNode=document.getElementById('report-rows');
  const message={type:'init',metadata:JSON.parse(metaNode.textContent),text:rowsNode.textContent};
  metaNode.remove();rowsNode.remove();
  document.getElementById('result-count').textContent='Indexing saved accounts…';
  document.getElementById('target').textContent='@'+message.metadata.target;
  let worker, receivePage, ready=false, fallback=false, workerURL;
  const receive = data => {
    if(data.type==='ready'){ready=true;message.text='';receivePage=startReport(data.metadata,data.values,send);document.body.dataset.reportEngine=fallback?'cooperative':'worker';}
    else if(data.type==='page' && receivePage)receivePage(data);
    else if(data.type==='error')document.getElementById('result-count').textContent=data.message;
  };
  let send;
  function localFallback(){
    if(fallback || ready)return;
    fallback=true;
    if(worker)worker.terminate();
    if(workerURL)URL.revokeObjectURL(workerURL);
    const engine=createReportEngine(receive,true);send=data=>{void engine(data)};send(message);
  }
  try{
    const source='const engine=('+createReportEngine.toString()+')(data=>self.postMessage(data));self.onmessage=e=>engine(e.data);';
    workerURL=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
    worker=new Worker(workerURL);
    worker.onmessage=e=>{if(e.data.type==='ready'){URL.revokeObjectURL(workerURL);workerURL=null;}receive(e.data)};
    worker.onerror=e=>{e.preventDefault();localFallback()};
    send=data=>worker.postMessage(data);send(message);
  }catch(_){localFallback()}
})();
