name: Full repository snapshot

on:
  push:
    branches:
      - work/dtk-only-20261001
    paths:
      - .github/workflows/full-snapshot.yml
      - DTK_RELEASE_READY

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Build full tracked snapshot
        shell: python
        run: |
          import hashlib
          import json
          import subprocess
          import zipfile
          from pathlib import Path

          raw = subprocess.check_output(['git', 'ls-files', '-z'])
          tracked = [p.decode('utf-8') for p in raw.split(b'\0') if p]
          manifest = {}

          for name in tracked:
              path = Path(name)
              if path.is_file():
                  manifest[name] = hashlib.sha256(path.read_bytes()).hexdigest()

          info = {
              'branch': 'work/dtk-only-20261001',
              'commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'tracked_files': len(manifest),
              'note': 'Full tracked DTK-only repository snapshot including runtime source, .github workflows, historical evidence, tests, and documentation.'
          }
          Path('FULL_SNAPSHOT_INFO.json').write_text(json.dumps(info, indent=2)+'\n', encoding='utf-8')
          Path('FULL_SNAPSHOT_SHA256.json').write_text(json.dumps(dict(sorted(manifest.items())), indent=2)+'\n', encoding='utf-8')

          output = Path('TikTokScanner_everything.zip')
          prefix = 'TikTokScanner_everything/'
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name in sorted(manifest):
                  z.write(name, prefix + name)
              z.write('FULL_SNAPSHOT_INFO.json', prefix + 'FULL_SNAPSHOT_INFO.json')
              z.write('FULL_SNAPSHOT_SHA256.json', prefix + 'FULL_SNAPSHOT_SHA256.json')

          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          Path('TikTokScanner_everything.zip.sha256').write_text(
              f'{digest}  TikTokScanner_everything.zip\n',
              encoding='utf-8',
          )

          with zipfile.ZipFile(output, 'r') as z:
              names = set(z.namelist())
              expected = {prefix+n for n in manifest} | {
                  prefix+'FULL_SNAPSHOT_INFO.json',
                  prefix+'FULL_SNAPSHOT_SHA256.json'
              }
              if names != expected:
                  raise SystemExit(f'inventory mismatch: missing={expected-names}, extra={names-expected}')
              for name, expected_hash in manifest.items():
                  actual = hashlib.sha256(z.read(prefix+name)).hexdigest()
                  if actual != expected_hash:
                      raise SystemExit(f'hash mismatch for {name}')

          print(json.dumps(info))
          print(f'zip_sha256={digest}')
          print(f'zip_entries={len(expected)}')

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: TikTokScanner-everything
          path: |
            TikTokScanner_everything.zip
            TikTokScanner_everything.zip.sha256
          if-no-files-found: error
